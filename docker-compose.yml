services:
  db:
    image: postgres:16-alpine
    container_name: GameArenaDB
    restart: unless-stopped
    # Keep these in sync with api/.env (DB_USERNAME, DB_PASSWORD, DB_URL's database name)
    environment:
      POSTGRES_DB: gamearenadb
      POSTGRES_USER: gamer
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamer -d gamearenadb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
