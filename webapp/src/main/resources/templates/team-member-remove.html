<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Remove Team Member')}">
    <title>GameArena - Remove Team Member</title>
</head>
<body>
<!--/*@thymesVar id="data" type="hr.algebra.gamearena.webapp.models.mvc.data.team.member.TeamMemberRemoveViewData"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" style="max-width: 480px;">
    <h1 class="mb-4">Remove Team Member</h1>

    <div th:replace="~{fragments/errors :: errors}"></div>

    <div th:if="${data != null}">
        <p>This will remove <strong th:text="${data.memberUsername()}"></strong> from the team. This action cannot be undone.</p>

        <form method="post" th:action="@{/team/{teamId}/member/{memberId}/remove(teamId=${data.teamId()},memberId=${data.memberId()})}">
            <button type="submit" class="btn btn-danger btn-lg w-100">Yes, remove this member</button>
        </form>
    </div>
</main>
</body>
</html>
