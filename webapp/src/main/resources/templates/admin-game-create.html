<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Add Game')}">
    <title>GameArena - Add Game</title>
</head>
<body>
<!--/*@thymesVar id="data" type="hr.algebra.gamearena.webapp.models.mvc.data.admin.games.GameCreatePostViewModel"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" style="max-width: 480px;">
    <h1 class="mb-4">Add Game</h1>

    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <form method="post" th:if="${data != null}" th:action="@{/admin/game/add}">
        <div class="mb-3">
            <label class="form-label">
                Name
                <input type="text" class="form-control" name="name" th:value="${data.name()}">
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label">Description
                <textarea class="form-control" name="description" th:text="${data.description()}"></textarea>
            </label>
        </div>

        <button type="submit" class="btn btn-primary">Create Game</button>
    </form>
</main>
</body>
</html>
