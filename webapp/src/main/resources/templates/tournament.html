<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tournament')}">
    <title>GameArena - Tournament</title>
</head>
<body>
<!--/*@thymesVar id="data" type="hr.algebra.gamearena.webapp.models.mvc.data.tournament.TournamentDetailViewData"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <div th:if="${data != null}"
         th:with="meMember=${data.meMember().orElse(null)},
                  membersFailed=${data.members().isEmpty()},
                  members=${data.members().orElse(null)},
                  matchesFailed=${data.matches().isEmpty()},
                  matches=${data.matches().orElse(null)}">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <h1 class="mb-0" th:text="${data.tournament().name()}"></h1>
            <div>
                <span class="badge fs-6 rounded-pill" th:classappend="${data.tournament().status()?.badgeClass()}" th:text="${data.tournament().status()}"></span>
                <a class="btn btn-outline-secondary btn-sm" th:if="${isTournamentOrganizerOrAdmin}" th:href="@{/tournament/{tournamentId}/edit(tournamentId=${data.tournament().id()})}">Edit Tournament</a>
            </div>
        </div>

        <p th:if="${data.tournament().description() != null}" th:text="${data.tournament().description()}"></p>

        <table class="table table-borderless w-auto mb-4">
            <tbody>
            <tr><th>Game</th><td th:text="${data.tournament().games()?.name()}"></td></tr>
            <tr><th>Price</th><td th:text="${data.tournament().soloPrice()} + ' ' + ${data.tournament().currency()}"></td></tr>
            <tr><th>Starts At</th><td th:text="${data.tournament().startsAt()}"></td></tr>
            <tr><th>Ends At</th><td th:text="${data.tournament().endsAt()}"></td></tr>
            </tbody>
        </table>

        <h2 class="h4 mb-3">Members</h2>
        <div class="alert alert-danger" th:if="${membersFailed}">Failed to load members of this tournament.</div>
        <div class="list-group" th:if="${not membersFailed and not #lists.isEmpty(members)}">
            <div class="list-group-item d-flex justify-content-between align-items-center" th:each="member : ${members}">
                <a class="text-decoration-none flex-grow-1" th:href="@{/user/{id}(id=${member.user().id()})}" th:text="${member.user().username()}"></a>
                <span class="badge rounded-pill me-2" th:classappend="${member.role()?.badgeClass()}" th:text="${member.role()}"></span>
                <a class="btn btn-outline-secondary btn-sm" th:if="${isTournamentOrganizerOrAdmin}"
                   th:href="@{/tournament/{tournamentId}/member/{memberId}/edit(tournamentId=${data.tournament().id()},memberId=${member.id()})}">Edit</a>
            </div>
        </div>
        <p class="text-muted fst-italic" th:if="${not membersFailed and #lists.isEmpty(members)}">No members in this tournament.</p>

        <div class="d-flex justify-content-between align-items-center mb-3 mt-4">
            <h2 class="h4 mb-0">Matches</h2>
            <a class="btn btn-primary btn-sm" th:if="${isTournamentOrganizerOrAdmin}" th:href="@{/tournament/{tournamentId}/match/add(tournamentId=${data.tournament().id()})}">Add Match</a>
        </div>
        <div class="alert alert-danger" th:if="${matchesFailed}">Failed to load matches of this tournament.</div>
        <div class="list-group" th:if="${not matchesFailed and not #lists.isEmpty(matches)}">
            <div class="list-group-item d-flex justify-content-between align-items-center" th:each="match : ${matches}">
                <a class="text-decoration-none flex-grow-1" th:href="@{/match/{matchId}(matchId=${match.id()})}">
                    <span th:text="${match.player1().username()} + ' VS ' + ${match.player2().username()}"></span>
                    <small class="text-muted" th:text="'(' + ${match.game().name()} + ')'"></small>
                </a>
                <span class="badge rounded-pill me-2" th:classappend="${match.status()?.badgeClass()}" th:text="${match.status()}"></span>
                <a class="btn btn-outline-secondary btn-sm" th:if="${isTournamentOrganizerOrAdmin}"
                   th:href="@{/match/{matchId}/edit(matchId=${match.id()})}">Edit</a>
            </div>
        </div>
        <p class="text-muted fst-italic" th:if="${not matchesFailed and #lists.isEmpty(matches)}">No matches in this tournament.</p>
    </div>
</main>
</body>
</html>
