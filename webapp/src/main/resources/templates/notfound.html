<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameArena - Not Found</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" style="max-width: 400px;">
    <h1 class="mb-4">Not found</h1>

    <ul class="alert alert-danger">
        <li th:each="error : ${errors}" th:text="${error.message()}"></li>
    </ul>

    <a class="btn btn-secondary" th:href="@{/}">Back to Home</a>
</main>
</body>
</html>
