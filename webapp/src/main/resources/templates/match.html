<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Match')}">
    <title>GameArena - Match</title>
</head>
<body>
<!--/*@thymesVar id="data" type="hr.algebra.gamearena.webapp.models.mvc.data.match.MatchDetailViewData"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <div th:if="${data != null}" th:with="match=${data.match()}">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <h1 class="mb-0" th:text="${match.player1().username()} + ' VS ' + ${match.player2().username()}"></h1>
            <div>
                <span class="badge fs-6 rounded-pill" th:classappend="${match.status()?.badgeClass()}" th:text="${match.status()}"></span>
                <a class="btn btn-outline-secondary btn-sm" th:if="${isTournamentOrganizerOrAdmin}" th:href="@{/match/{matchId}/edit(matchId=${match.id()})}">Edit Match</a>
            </div>
        </div>

        <table class="table table-borderless w-auto mb-4">
            <tbody>
            <tr>
                <th>Tournament</th>
                <td><a th:href="@{/tournament/{tournamentId}(tournamentId=${match.tournamentId()})}" th:text="${match.tournamentId()}"></a></td>
            </tr>
            <tr><th>Game</th><td th:text="${match.game().name()}"></td></tr>
            <tr>
                <th>Player 1</th>
                <td><a th:href="@{/user/{id}(id=${match.player1().id()})}" th:text="${match.player1().username()}"></a></td>
            </tr>
            <tr>
                <th>Player 2</th>
                <td><a th:href="@{/user/{id}(id=${match.player2().id()})}" th:text="${match.player2().username()}"></a></td>
            </tr>
            <tr><th>Score</th><td th:text="${match.playerOneScore()} + ' - ' + ${match.playerTwoScore()}"></td></tr>
            <tr>
                <th>Winner</th>
                <td>
                    <a th:if="${match.winner().isPresent()}"
                       th:href="@{/user/{id}(id=${match.winner().get().id()})}"
                       th:text="${match.winner().get().username()}"></a>
                    <span th:unless="${match.winner().isPresent()}">-</span>
                </td>
            </tr>
            <tr><th>Scheduled At</th><td th:text="${match.scheduledAt()}"></td></tr>
            <tr><th>Played At</th><td th:text="${match.playedAt()}"></td></tr>
            <tr><th>Created At</th><td th:text="${match.createdAt()}"></td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
