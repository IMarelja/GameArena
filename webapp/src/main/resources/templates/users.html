<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameArena - Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <h1 class="mb-4">Users</h1>

    <ul class="alert alert-danger" th:if="${not #lists.isEmpty(errors)}">
        <li th:each="error : ${errors}" th:text="${error.message()}"></li>
    </ul>

    <table class="table table-striped table-bordered" th:if="${not #lists.isEmpty(data)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Created At</th>
            <th>Deleted</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${data}">
            <td th:text="${user.id()}"></td>
            <td th:text="${user.username()}"></td>
            <td th:text="${user.createdAt()}"></td>
            <td th:text="${user.isDeleted()}"></td>
        </tr>
        </tbody>
    </table>

    <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data)}">No users found.</p>
</main>
</body>
</html>
