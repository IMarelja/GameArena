<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Users')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <h1 class="mb-4">Users</h1>

    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <table class="table table-striped table-bordered" th:if="${not #lists.isEmpty(data)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Created At</th>
            <th>Deleted</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${data}">
            <td th:text="${user.id()}"></td>
            <td th:text="${user.username()}"></td>
            <td th:text="${user.createdAt()}"></td>
            <td th:text="${user.isDeleted()}"></td>
        </tr>
        </tbody>
    </table>

    <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data) and #lists.isEmpty(errors)}">No users found.</p>
</main>
</body>
</html>
