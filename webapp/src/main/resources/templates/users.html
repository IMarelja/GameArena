<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Users')}"></head>
<body>
<!--/*@thymesVar id="data" type="java.util.List<hr.algebra.gamearena.webapp.models.cereal.user.UserViewDtoDecereal>"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <h1 class="mb-4">Users</h1>

    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <div class="list-group" th:if="${not #lists.isEmpty(data)}">
        <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
           th:each="user : ${data}"
           th:href="@{/users/{id}(id=${user.id()})}">
            <span th:text="${user.username()}"></span>
            <span class="badge text-bg-danger rounded-pill" th:if="${user.isDeleted()}">Deleted</span>
        </a>
    </div>

    <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data) and #lists.isEmpty(errors)}">No users found.</p>
</main>
</body>
</html>
