<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Team')}">
    <title>GameArena - Team</title>
</head>
<body>
<!--/*@thymesVar id="data" type="hr.algebra.gamearena.webapp.models.mvc.data.team.TeamDetailViewData"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <div th:if="${data != null}"
         th:with="meMember=${data.meMember().orElse(null)},
                  canEdit=${meMember != null and meMember.role().name() == 'CAPTAIN'},
                  membersFailed=${data.members().isEmpty()},
                  members=${data.members().orElse(null)}">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <h1 class="mb-0" th:text="${data.team().name()}"></h1>
            <a class="btn btn-outline-secondary btn-sm" th:if="${canEdit}" th:href="@{/team/{id}/edit(id=${data.team().id()})}">Edit Team</a>
        </div>

        <table class="table table-borderless w-auto mb-4">
            <tbody>
            <tr><th>Game</th><td th:text="${data.team().game()?.name()}"></td></tr>
            <tr><th>Members</th><td th:text="${data.team().memberCount()}"></td></tr>
            <tr><th>Created At</th><td th:text="${data.team().createdAt()}"></td></tr>
            </tbody>
        </table>

        <h2 class="h4 mb-3">Members</h2>
        <div class="alert alert-danger" th:if="${membersFailed}">
            Failed to load members of this team.
        </div>
        <div class="list-group" th:if="${not membersFailed and not #lists.isEmpty(members)}">
            <div class="list-group-item d-flex justify-content-between align-items-center" th:each="member : ${members}">
                <a class="text-decoration-none flex-grow-1" th:href="@{/user/{id}(id=${member.userId()})}" th:text="${member.username()}"></a>
                <span class="badge rounded-pill me-2"
                      th:classappend="${member.role()?.badgeClass()}"
                      th:text="${member.role()}">
                </span>
                <a class="btn btn-outline-secondary btn-sm me-1"
                   th:if="${canEdit}"
                   th:href="@{/team/{teamId}/member/{memberId}/edit(teamId=${data.team().id()},memberId=${member.memberId()})}">
                    Edit
                </a>
                <a class="btn btn-outline-danger btn-sm"
                   th:if="${canEdit}"
                   th:href="@{/team/{teamId}/member/{memberId}/remove(teamId=${data.team().id()},memberId=${member.memberId()})}">
                    Remove
                </a>
            </div>
        </div>
        <p class="text-muted fst-italic" th:if="${not membersFailed and #lists.isEmpty(members)}">No members in this team.</p>
    </div>
</main>
</body>
</html>
