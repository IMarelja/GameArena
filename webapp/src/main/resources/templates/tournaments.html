<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tournaments')}">
    <title>GameArena - Tournaments</title>
</head>
<body>
<!--/*@thymesVar id="data" type="java.util.List<hr.algebra.gamearena.webapp.models.mvc.data.tournament.TournamentViewData>"*/-->
<!--/*@thymesVar id="isAdmin" type="java.lang.Boolean"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <h1 class="mb-0">Tournaments</h1>
        <a class="btn btn-primary btn-sm" th:if="${isAdmin}" th:href="@{/tournaments/add}">Add Tournament</a>
    </div>

    <div th:replace="~{fragments/errors :: errors}"></div>

    <div class="list-group" th:if="${not #lists.isEmpty(data)}">
        <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
           th:each="tournament : ${data}"
           th:href="@{/tournament/{tournamentId}(tournamentId=${tournament.id()})}">
            <div>
                <div class="fw-semibold" th:text="${tournament.name()}"></div>
                <div class="text-muted small">
                    <span th:text="${tournament.games()?.name()}"></span>
                    <span th:if="${tournament.soloPrice() != null}" th:text="'· ' + ${tournament.soloPrice()} + ' ' + ${tournament.currency()}"></span>
                </div>
            </div>
            <span class="badge rounded-pill" th:classappend="${tournament.status()?.badgeClass()}" th:text="${tournament.status()}"></span>
        </a>
    </div>

    <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data) and #lists.isEmpty(errors)}">No tournaments found.</p>
</main>
</body>
</html>
