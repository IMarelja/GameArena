<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tournaments')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <h1 class="mb-4">Tournaments</h1>

    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <table class="table table-striped table-bordered" th:if="${not #lists.isEmpty(data)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Game</th>
            <th>Status</th>
            <th>Price</th>
            <th>Starts At</th>
            <th>Ends At</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tournament : ${data}">
            <td th:text="${tournament.id()}"></td>
            <td th:text="${tournament.name()}"></td>
            <td th:text="${tournament.games()?.name()}"></td>
            <td th:text="${tournament.status()}"></td>
            <td th:text="${tournament.soloPrice()} + ' ' + ${tournament.currency()}"></td>
            <td th:text="${tournament.startsAt()}"></td>
            <td th:text="${tournament.endsAt()}"></td>
        </tr>
        </tbody>
    </table>

    <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data) and #lists.isEmpty(errors)}">No tournaments found.</p>
</main>
</body>
</html>
