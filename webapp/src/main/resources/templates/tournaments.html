<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameArena - Tournaments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <h1 class="mb-4">Tournaments</h1>

    <ul class="alert alert-danger" th:if="${not #lists.isEmpty(errors)}">
        <li th:each="error : ${errors}" th:text="${error.message()}"></li>
    </ul>

    <table class="table table-striped table-bordered" th:if="${not #lists.isEmpty(data)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Game</th>
            <th>Status</th>
            <th>Price</th>
            <th>Starts At</th>
            <th>Ends At</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tournament : ${data}">
            <td th:text="${tournament.id()}"></td>
            <td th:text="${tournament.name()}"></td>
            <td th:text="${tournament.games()?.name()}"></td>
            <td th:text="${tournament.status()}"></td>
            <td th:text="${tournament.soloPrice()} + ' ' + ${tournament.currency()}"></td>
            <td th:text="${tournament.startsAt()}"></td>
            <td th:text="${tournament.endsAt()}"></td>
        </tr>
        </tbody>
    </table>

    <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data) and #lists.isEmpty(errors)}">No tournaments found.</p>
</main>
</body>
</html>
