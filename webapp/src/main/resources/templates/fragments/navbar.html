<!--/*@thymesVar id="authenticated" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="isAdmin" type="java.lang.Boolean"*/-->
<nav th:fragment="navbar" xmlns:th="http://www.thymeleaf.org" class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">GameArena</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/tournaments}">Tournaments</a>
            <a class="nav-link" th:href="@{/teams}">Teams</a>
            <a class="nav-link" th:href="@{/users}">Users</a>
        </div>
        <div class="navbar-nav bg-info rounded px-2 me-2" th:if="${isAdmin}">
            <a class="nav-link" th:href="@{/logs}">Logs</a>
        </div>
        <div class="navbar-nav" th:if="${authenticated}">
            <a class="nav-link" id="notifications-nav-link" th:href="@{/notifications}"
               th:attr="data-stream-url=@{/notifications/stream/unread}">Notifications</a>
            <a class="nav-link" th:href="@{/me}">Me</a>
            <form method="post" th:action="@{/logout}" class="d-flex">
                <button type="submit" class="nav-link btn btn-link">Log Out</button>
            </form>
        </div>
        <div class="navbar-nav" th:unless="${authenticated}">
            <a class="nav-link" th:href="@{/login}">Login</a>
            <a class="nav-link" th:href="@{/register}">Register</a>
        </div>
    </div>

    <script th:if="${authenticated}">
        $(function () {
            var $link = $('#notifications-nav-link');
            var streamUrl = $link.data('stream-url');

            function showUnavailable() {
                $link.css('text-decoration', 'line-through').text('Notifications');
            }

            function showCount(count) {
                $link.css('text-decoration', 'none');
                $link.text(count > 0 ? 'Notifications (' + count + ')' : 'Notifications');
            }

            var source = new EventSource(streamUrl);

            source.addEventListener('unread-count', function (event) {
                try {
                    var payload = JSON.parse(event.data);
                    showCount(payload.count || 0);
                } catch (e) {
                    showUnavailable();
                }
            });

            source.onerror = showUnavailable;
        });
    </script>
</nav>
