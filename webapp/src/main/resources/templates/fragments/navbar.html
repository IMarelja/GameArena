<!--/*@thymesVar id="authenticated" type="java.lang.Boolean"*/-->
<!--/*@thymesVar id="isAdmin" type="java.lang.Boolean"*/-->
<nav th:fragment="navbar" xmlns:th="http://www.thymeleaf.org" class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">GameArena</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" th:href="@{/tournaments}">Tournaments</a>
            <a class="nav-link" th:href="@{/teams}">Teams</a>
            <a class="nav-link" th:href="@{/users}">Users</a>
        </div>
        <div class="navbar-nav bg-info rounded px-2 me-2" th:if="${isAdmin}">
            <a class="nav-link" th:href="@{/logs}">Logs</a>
        </div>
        <div class="navbar-nav" th:if="${authenticated}">
            <a class="nav-link" th:href="@{/me}">Me</a>
            <form method="post" th:action="@{/logout}" class="d-flex">
                <button type="submit" class="nav-link btn btn-link">Log Out</button>
            </form>
        </div>
        <div class="navbar-nav" th:unless="${authenticated}">
            <a class="nav-link" th:href="@{/login}">Login</a>
            <a class="nav-link" th:href="@{/register}">Register</a>
        </div>
    </div>
</nav>
