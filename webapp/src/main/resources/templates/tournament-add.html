<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Add Tournament')}">
    <title>GameArena - Add Tournament</title>
</head>
<body>
<!--/*@thymesVar id="data" type="hr.algebra.gamearena.webapp.models.mvc.data.tournament.TournamentCreateFormViewData"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" style="max-width: 560px;">
    <h1 class="mb-4">Add Tournament</h1>

    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <form method="post"
          th:if="${data != null}" th:action="@{/tournaments/add}">
        <div class="mb-3">
            <label class="form-label">
                Name
                <input type="text" class="form-control" name="name" th:value="${data.form().name()}">
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label">Description
                <textarea class="form-control" name="description"
                          th:text="${data.form().description()}">
                </textarea>
            </label>
        </div>
        <div class="mb-3">
            <label class="form-label">
                Game
                <select class="form-select" name="gameId">
                    <option th:if="${#lists.isEmpty(data.activeGames())}" value="" disabled selected>Could not load active games, create new one or reactive other</option>
                    <option th:each="game : ${data.activeGames()}"
                            th:value="${game.id()}"
                            th:selected="${data.form().gameId() != null and game.id() == data.form().gameId()}"
                            th:text="${game.name()}"></option>
                </select>
            </label>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Solo Price
                    <input type="number" step="0.01" class="form-control" name="soloPrice" th:value="${data.form().soloPrice()}">
                </label>
            </div>
            <div class="col">
                <label class="form-label">Group Price
                    <input type="number" step="0.01" class="form-control" name="groupPrice" th:value="${data.form().groupPrice()}">
                </label>
            </div>
            <div class="col">
                <label class="form-label">Currency
                    <select class="form-select" name="currency">
                        <option th:each="currency : ${T(hr.algebra.gamearena.webapp.models.mvc.data.tournament.AcceptedCurrencyDataView).values()}"
                                th:value="${currency}"
                                th:selected="${data.form().currency() != null and currency == data.form().currency()}"
                                th:text="${currency}"></option>
                    </select>
                </label>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">Starts At
                    <input type="datetime-local" class="form-control" name="startsAt" th:value="${data.form().startsAt()}">
                </label>
            </div>
            <div class="col">
                <label class="form-label">Ends At
                    <input type="datetime-local" class="form-control" name="endsAt" th:value="${data.form().endsAt()}">
                </label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Create Tournament</button>
    </form>
</main>
</body>
</html>
