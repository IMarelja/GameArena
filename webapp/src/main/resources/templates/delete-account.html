<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Delete Account')}">
    <title>GameArena - Delete Account</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" style="max-width: 480px;">
    <h1 class="mb-4">Delete Account</h1>

    <div th:replace="~{fragments/errors :: errors}"></div>

    <p>This will permanently delete your account. This action cannot be undone.</p>

    <form method="post" th:action="@{/me/delete}">
        <button type="submit" class="btn btn-danger btn-lg w-100">Yes, delete my account</button>
    </form>
</main>
</body>
</html>
