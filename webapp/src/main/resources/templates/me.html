<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Me')}">
    <title>GameArena - Me</title>
</head>
<body>
<!--/*@thymesVar id="data" type="hr.algebra.gamearena.webapp.models.mvc.data.user.MeProfileViewData"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <h1 class="mb-4">Me</h1>

    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <div th:if="${data != null}">

        <section class="mb-5" th:if="${data.user() != null}">
            <h2 class="h4 mb-3">Profile</h2>
            <table class="table table-bordered w-auto">
                <tbody>
                <tr><th>ID</th><td th:text="${data.user().id()}"></td></tr>
                <tr><th>Username</th><td th:text="${data.user().username()}"></td></tr>
                <tr><th>Email</th><td th:text="${data.user().email()}"></td></tr>
                <tr><th>Role</th><td th:text="${data.user().role()}"></td></tr>
                <tr><th>Created At</th><td th:text="${data.user().createdAt()}"></td></tr>
                <tr><th>Active</th><td th:text="${data.user().isActive()}"></td></tr>
                </tbody>
            </table>
        </section>

        <section class="mb-5">
            <h2 class="h4 mb-3">Leaderboard Stats</h2>
            <table class="table table-striped table-bordered" th:if="${not #lists.isEmpty(data.leaderboard())}">
                <thead>
                <tr>
                    <th>Tournament</th>
                    <th>Matches Played</th>
                    <th>Matches Won</th>
                    <th>Total Points</th>
                    <th>Average Points</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${data.leaderboard()}">
                    <td th:text="${entry.tournamentName()}"></td>
                    <td th:text="${entry.matchesPlayed()}"></td>
                    <td th:text="${entry.matchesWon()}"></td>
                    <td th:text="${entry.totalPoints()}"></td>
                    <td th:text="${entry.averagePoints()}"></td>
                </tr>
                </tbody>
            </table>
            <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data.leaderboard())}">No leaderboard stats found.</p>
        </section>

        <section class="mb-5">
            <h2 class="h4 mb-3">My Tournaments</h2>
            <table class="table table-striped table-bordered" th:if="${not #lists.isEmpty(data.tournaments())}">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Game</th>
                    <th>Status</th>
                    <th>Starts At</th>
                    <th>Ends At</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tournament : ${data.tournaments()}">
                    <td th:text="${tournament.id()}"></td>
                    <td th:text="${tournament.name()}"></td>
                    <td th:text="${tournament.games()?.name()}"></td>
                    <td th:text="${tournament.status()}"></td>
                    <td th:text="${tournament.startsAt()}"></td>
                    <td th:text="${tournament.endsAt()}"></td>
                </tr>
                </tbody>
            </table>
            <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data.tournaments())}">No tournaments found.</p>
        </section>

        <section class="mb-5">
            <h2 class="h4 mb-3">My Matches</h2>
            <div class="list-group" th:if="${not #lists.isEmpty(data.matches())}">
                <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                   th:each="match : ${data.matches()}"
                   th:href="@{/match/{id}(id=${match.id()})}">
                    <span>
                        <span th:text="${match.player1().username()} + ' VS ' + ${match.player2().username()}"></span>
                        <small class="text-muted" th:text="'(' + ${match.game().name()} + ')'"></small>
                    </span>
                    <span class="badge rounded-pill" th:classappend="${match.status()?.badgeClass()}" th:text="${match.status()}"></span>
                </a>
            </div>
            <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data.matches())}">No matches found.</p>
        </section>

    </div>
</main>
</body>
</html>
