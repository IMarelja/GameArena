<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Login')}">
    <title>GameArena - Login</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" style="max-width: 400px;">
    <h1 class="mb-4">Login</h1>

    <div th:replace="~{fragments/errors :: errors}"></div>

    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label class="form-label" for="usernameOrEmail">Username or Email</label>
            <input type="text" class="form-control" id="usernameOrEmail" name="usernameOrEmail" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p class="mt-3">Don't have an account? <a th:href="@{/register}">Register</a></p>
</main>
</body>
</html>
