<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GameArena - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" style="max-width: 400px;">
    <h1 class="mb-4">Login</h1>

    <ul class="alert alert-danger" th:if="${not #lists.isEmpty(errors)}">
        <li th:each="error : ${errors}" th:text="${error.message()}"></li>
    </ul>

    <form method="post" th:action="@{/login}">
        <div class="mb-3">
            <label class="form-label" for="usernameOrEmail">Username or Email</label>
            <input type="text" class="form-control" id="usernameOrEmail" name="usernameOrEmail" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
</main>
</body>
</html>
