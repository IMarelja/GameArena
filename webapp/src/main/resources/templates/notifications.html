<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Notifications')}">
    <title>GameArena - Notifications</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" id="notifications-app"
      th:attr="data-stream-url=@{/notifications/stream/all},data-status-base-url=@{/notifications}">
    <h1 class="mb-4">Notifications</h1>

    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <div id="notifications-error" class="alert alert-danger" style="display:none;">
        Could not load notifications right now. Please try again later.
    </div>

    <table class="table table-striped table-bordered" id="notifications-table" style="display:none;">
        <thead>
        <tr>
            <th>Type</th>
            <th>Created At</th>
            <th>Status</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="notifications-body"></tbody>
    </table>

    <p id="notifications-empty" class="text-muted fst-italic" style="display:none;">No notifications found.</p>
</main>

<script>
    class NotificationsView {
        constructor($root) {
            this.statusBaseUrl = $root.data('status-base-url');
            this.$table = $('#notifications-table');
            this.$body = $('#notifications-body');
            this.$empty = $('#notifications-empty');
            this.$error = $('#notifications-error');
        }

        setReadStatus(id, read) {
            $.ajax({
                url: `${this.statusBaseUrl}/${id}/update`,
                type: 'PATCH',
                contentType: 'application/json',
                data: JSON.stringify({ read })
            }).fail(() => this.showError());
        }

        deleteNotification(id) {
            if (!window.confirm('Delete this notification?')) {
                return;
            }

            $.ajax({
                url: `${this.statusBaseUrl}/${id}`,
                type: 'DELETE'
            }).fail(() => this.showError());
        }

        buildTypeCell(notification) {
            const hasId = notification.referenceId !== null && notification.referenceId !== undefined;
            const hasType = notification.referenceType !== null && notification.referenceType !== undefined;

            if (!hasId && !hasType) {
                return $('<td>').text(notification.type);
            }

            if (hasId !== hasType) {
                return $('<td>').append($('<s>').text(notification.type));
            }

            switch (notification.referenceType) {
                case 'MATCH':
                    return $('<td>').append($('<a>').attr('href', `/match/${notification.referenceId}`).text(notification.type));
                case 'TEAM_INVITATION':
                    return $('<td>').append($('<a>').attr('href', `/team-invite/${notification.referenceId}`).text(notification.type));
                default:
                    return $('<td>').append($('<s>').text(notification.type));
            }
        }

        buildRow(notification) {
            const $type = this.buildTypeCell(notification);
            const $createdAt = $('<td>').text(notification.createdAt);

            const $badge = $('<span class="badge">')
                .addClass(notification.read ? 'text-bg-secondary' : 'text-bg-primary')
                .text(notification.read ? 'Read' : 'Unread');
            const $status = $('<td>').append($badge);

            const $readButton = $('<button type="button" class="btn btn-sm btn-outline-secondary">')
                .text(notification.read ? 'Mark as unread' : 'Mark as read')
                .on('click', () => this.setReadStatus(notification.id, !notification.read));

            const $deleteButton = $('<button type="button" class="btn btn-sm btn-outline-danger ms-1">')
                .text('Delete')
                .on('click', () => this.deleteNotification(notification.id));

            const $actions = $('<td>').append($readButton, $deleteButton);

            return $('<tr>').append($type, $createdAt, $status, $actions);
        }

        render(notifications) {
            this.$body.empty();

            if (!notifications || notifications.length === 0) {
                this.$table.hide();
                this.$empty.show();
                return;
            }

            notifications.forEach((notification) => this.$body.append(this.buildRow(notification)));

            this.$empty.hide();
            this.$table.show();
        }

        showError() {
            this.$error.show();
        }

        hideError() {
            this.$error.hide();
        }
    }

    $(function () {
        const $app = $('#notifications-app');
        const view = new NotificationsView($app);
        const source = new EventSource($app.data('stream-url'));

        source.addEventListener('all-notifications', (event) => {
            try {
                view.hideError();
                view.render(JSON.parse(event.data));
            } catch (e) {
                view.showError();
            }
        });

        source.onerror = () => view.showError();
    });
</script>
</body>
</html>
