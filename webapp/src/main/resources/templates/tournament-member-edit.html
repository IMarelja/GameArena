<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit Tournament Member')}">
    <title>GameArena - Edit Tournament Member</title>
</head>
<body>
<!--/*@thymesVar id="data" type="hr.algebra.gamearena.webapp.models.mvc.data.tournament.member.TournamentMemberEditFormViewData"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4" style="max-width: 480px;">
    <h1 class="mb-4">Edit Member</h1>

    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <div th:if="${data != null}">
        <p>Editing <strong th:text="${data.memberUsername()}"></strong>'s role.</p>

        <form method="post" th:action="@{/tournament/{tournamentId}/member/{memberId}/edit(tournamentId=${data.tournamentId()},memberId=${data.memberId()})}">
            <div class="mb-3">
                <label class="form-label">Role
                    <select class="form-select" name="role">
                        <option th:each="role : ${T(hr.algebra.gamearena.webapp.models.mvc.data.tournament.member.TournamentMemberRoleEditViewEnum).values()}"
                                th:value="${role}"
                                th:selected="${role == data.form().role()}"
                                th:text="${role}"></option>
                    </select>
                </label>
            </div>

            <button type="submit" class="btn btn-primary">Save Changes</button>
        </form>
    </div>
</main>
</body>
</html>
