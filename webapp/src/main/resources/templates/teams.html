<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Teams')}">
    <title>GameArena - Teams</title>
</head>
<body>
<!--/*@thymesVar id="data" type="java.util.List<hr.algebra.gamearena.webapp.models.mvc.data.team.TeamMinimalViewData>"*/-->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-start mb-4">
        <h1 class="mb-0">Teams</h1>
        <a class="btn btn-primary btn-sm" th:if="${authenticated}" th:href="@{/team/add}">Add Team</a>
    </div>

    <div th:replace="~{fragments/errors :: errors(${errors})}"></div>

    <div class="list-group" th:if="${not #lists.isEmpty(data)}">
        <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
           th:each="team : ${data}"
           th:href="@{/team/{teamId}(teamId=${team.id()})}">
            <span class="fw-semibold" th:text="${team.name()}"></span>
            <span class="badge text-bg-secondary rounded-pill" th:text="${team.memberCount()} + ' members'"></span>
        </a>
    </div>

    <p class="text-muted fst-italic" th:if="${#lists.isEmpty(data) and #lists.isEmpty(errors)}">No teams found.</p>
</main>
</body>
</html>
