services:
  app:
    image: sonarqube:26.6.0.123539-community
    depends_on:
      - db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - app_data:/opt/sonarqube/data
      - app_extensions:/opt/sonarqube/extensions
      - app_logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  app_data:
  app_extensions:
  app_logs:
  db_data:
