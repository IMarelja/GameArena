spring.application.name=GameArenaAPI

spring.config.import=file:.env[.properties]

jwt.secret=${JWT_SECRET}
# jwt.secret=zOPWepPHUfaRCCR9xHgSemJ9eiO4E6mFo7/u7/MOaug=
jwt.expiration.default=3600
jwt.expiration.rememberMe=2592000

spring.datasource.url=${DB_URL}
# spring.datasource.url=jdbc:postgresql://localhost:5432/gamearenadb

# Example: postgres
spring.datasource.username=${DB_USERNAME}
# spring.datasource.username=gamer

# Example: mysecretpassword
spring.datasource.password=${DB_PASSWORD}
# spring.datasource.password=mysecretpassword

spring.datasource.driver-class-name=org.postgresql.Driver

#server.port=${PORT:8080}
server.port=5762

# SSE streams disable default timeout of 30 secs
spring.mvc.async.request-timeout=-1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.data.rest.detection-strategy=annotated



# Actively ping idle pooled connections so a network-dropped connection is caught and
# replaced before a real request borrows it and stalls for the full connection-timeout.
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.leak-detection-threshold=30000
# Long-lived requests (SSE notification streams) would otherwise pin a pooled DB connection
# for their entire open duration if a JPA session stays bound to the whole HTTP request.
spring.jpa.open-in-view=false

